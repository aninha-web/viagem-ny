<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Viagem NY + Orlando</title>
<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1014" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" crossorigin="anonymous">
<style>
/* Layout: uma coluna de celular, abas fixas embaixo, formulários em folhas que sobem de baixo */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#EBEDF1; --ink:#14151A; --muted:#555963;
  --line:#E2E4E9; --line-strong:#C8CBD2;
  --accent:#F2B705; --on-accent:#14151A; --link:#2546D8; --danger:#B42318;
  --hero:#14151A; --on-hero:#FFFFFF; --hero-muted:#C3C6CE; --hero-line:#43454E;
  --info-bg:#E8EDFF; --info-fg:#1A2B7A;
  --ok-bg:#DDF2E2; --ok-fg:#1B5A2A; --warn-bg:#FFF0BF; --warn-fg:#5A4200;
  --plan-bg:#E8EDFF; --plan-fg:#1A2B7A; --note-bg:#EBEDF1; --note-fg:#3A3D45;
  --c0:#2546D8; --c1:#B83A0B; --c2:#1F7A3A; --c3:#7A3FC4;
  --scrim:rgba(10,11,14,.5);
  --font-display:'Archivo Narrow','Arial Narrow','Roboto Condensed',sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1014; --surface:#1A1B21; --surface-2:#25272E; --ink:#F1F2F5; --muted:#A6AAB4;
    --line:#2C2E36; --line-strong:#454852;
    --accent:#F2B705; --on-accent:#14151A; --link:#9DB4FF; --danger:#FF8A80;
    --hero:#25272F; --on-hero:#FFFFFF; --hero-muted:#BBBEC7; --hero-line:#464953;
    --info-bg:#1E2747; --info-fg:#CAD5FF;
    --ok-bg:#163A22; --ok-fg:#B7EBC4; --warn-bg:#3D3210; --warn-fg:#FFE08A;
    --plan-bg:#1E2747; --plan-fg:#CAD5FF; --note-bg:#2C2E36; --note-fg:#D3D6DD;
    --c0:#7D97FF; --c1:#FF8A5C; --c2:#5FCB82; --c3:#B98CFF;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1014; --surface:#1A1B21; --surface-2:#25272E; --ink:#F1F2F5; --muted:#A6AAB4;
  --line:#2C2E36; --line-strong:#454852;
  --accent:#F2B705; --on-accent:#14151A; --link:#9DB4FF; --danger:#FF8A80;
  --hero:#25272F; --on-hero:#FFFFFF; --hero-muted:#BBBEC7; --hero-line:#464953;
  --info-bg:#1E2747; --info-fg:#CAD5FF;
  --ok-bg:#163A22; --ok-fg:#B7EBC4; --warn-bg:#3D3210; --warn-fg:#FFE08A;
  --plan-bg:#1E2747; --plan-fg:#CAD5FF; --note-bg:#2C2E36; --note-fg:#D3D6DD;
  --c0:#7D97FF; --c1:#FF8A5C; --c2:#5FCB82; --c3:#B98CFF;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(112px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top-text{display:flex;flex-direction:column;gap:4px;min-width:0}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--font-display);font-size:34px;line-height:1.05;font-weight:700;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px;flex-shrink:0}
.icon-btn{width:44px;height:44px;flex-shrink:0;border-radius:14px;border:0;display:grid;place-items:center;cursor:pointer;background:var(--surface);color:var(--ink);text-decoration:none}
.icon-btn.primary{background:var(--accent);color:var(--on-accent)}
.icon-btn.soft{background:var(--surface-2)}
section{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec{margin:0;font-size:18px;font-weight:700}
.link-btn{background:none;border:0;color:var(--link);font-weight:500;font-size:14px;cursor:pointer;min-height:44px;padding:0 4px;display:inline-flex;align-items:center;text-decoration:none}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn[disabled]{opacity:.6;cursor:default}
.btn.light{background:var(--on-hero);color:#14151A}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--surface-2);color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.notice{background:var(--info-bg);color:var(--info-fg);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:14px}
.notice .btn{min-height:44px;padding:0 14px;font-size:14px;background:var(--info-fg);color:var(--info-bg);flex-shrink:0}
.loading{color:var(--muted);font-size:14px;padding:8px 0}

.hero{background:var(--hero);color:var(--on-hero);border-radius:20px;padding:20px;gap:10px}
.pill{align-self:flex-start;padding:4px 10px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700}
.hero-title{margin:0;font-family:var(--font-display);font-size:32px;line-height:1.05;font-weight:700;overflow-wrap:anywhere}
.hero-sub{margin:0;font-size:14px;color:var(--hero-muted)}
.hero-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:4px;padding-top:12px;border-top:1px dashed var(--hero-line)}
.kv{display:flex;flex-direction:column;gap:2px;min-width:0}
.hero .k{font-size:12px;color:var(--hero-muted)}
.kv .v{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.hero .btn{margin-top:6px}
.meter-dark{height:10px;border-radius:5px;background:var(--hero-line);overflow:hidden}
.meter-dark i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.big{font-family:var(--font-display);font-size:44px;line-height:1;font-weight:700}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{width:100%;text-align:left;display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:0;border-radius:14px;cursor:pointer;color:var(--ink)}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.m{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.amt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.day-sep{font-size:13px;font-weight:700;color:var(--muted);padding:6px 2px 0}
.tl{display:flex;gap:12px;align-items:flex-start}
.tl .time{width:52px;flex-shrink:0;padding-top:14px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.row-card{flex:1;min-width:0;text-align:left;padding:12px 14px;background:var(--surface);border:0;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.tag{align-self:flex-start;display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap}
.tag-show,.st-loteria{background:var(--warn-bg);color:var(--warn-fg)}
.tag-plan,.st-quero{background:var(--plan-bg);color:var(--plan-fg)}
.tag-place,.st-comprado{background:var(--ok-bg);color:var(--ok-fg)}
.tag-note{background:var(--note-bg);color:var(--note-fg)}

.empty{border:1.5px dashed var(--line-strong);border-radius:16px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.empty p{margin:0}
.empty .e-title{font-weight:700;font-size:15px}
.empty .e-text{font-size:14px;color:var(--muted);max-width:32ch}
.empty .btn{margin-top:6px;min-height:44px;font-size:14px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-weight:500;opacity:.8;margin-left:4px}

.cal{background:var(--surface);border-radius:18px;padding:12px;gap:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.cal-day{position:relative;height:52px;border:0;border-radius:12px;background:var(--surface-2);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:16px;padding:0}
.cal-day[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-day .city{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%}
.cal-day .bar{width:16px;height:3px;border-radius:2px;background:currentColor}
.cal-day .bar.none{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:4px 4px 0;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

.ticket{width:100%;text-align:left;border:0;padding:0;background:var(--surface);border-radius:18px;overflow:hidden;cursor:pointer;color:var(--ink);display:flex;flex-direction:column}
.ticket .main{padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px}
.ticket .line1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ticket .when{font-size:13px;font-weight:700;color:var(--muted)}
.ticket .title{font-family:var(--font-display);font-size:24px;line-height:1.1;font-weight:700;overflow-wrap:anywhere}
.ticket .stub{padding:10px 16px 12px;border-top:1px dashed var(--line-strong);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ticket .k{font-size:12px;color:var(--muted)}

.seg{display:flex;padding:3px;gap:2px;background:var(--surface-2);border-radius:14px}
.seg button{min-width:56px;min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.seg-wide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.seg-wide button{min-width:0}
.sim-add{margin:0;background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.sim-add input{height:44px}
.sim-row{display:flex;gap:8px;align-items:center}
.sim-row input{flex:1}
.sim-row .seg{flex-shrink:0}
.sim-row .seg button{min-width:48px;min-height:38px}
.sim-item{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 14px;border-radius:14px;background:var(--surface);border:1.5px solid transparent}
.sim-item.on{border-color:var(--ink)}
.sim-item:not(.on) .t,.sim-item:not(.on) .amt{color:var(--muted)}
.sim-check{flex:1;min-width:0;min-height:48px;display:flex;align-items:center;gap:12px;cursor:pointer}
.sim-check input{width:22px;height:22px;margin:0;flex-shrink:0;accent-color:var(--ink)}
.lanc-item{padding:12px 14px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
:root{--per-manha:#8A5A00;--per-tarde:#B83A0B;--per-noite:#3B2FC9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--per-manha:#F0B44C;--per-tarde:#FF8A5C;--per-noite:#A9A2FF}}
:root[data-theme="dark"]{--per-manha:#F0B44C;--per-tarde:#FF8A5C;--per-noite:#A9A2FF}
.chip{display:inline-flex;align-items:center;gap:6px}
.chip-ic{padding-left:6px}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px}
.nbadge{position:absolute;top:3px;right:3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center;box-sizing:border-box}
.map-tools{display:flex;justify-content:space-between;align-items:center;gap:8px}
.map-tools .seg button{min-width:72px}
.dias-btn{min-height:44px;padding:0 14px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.dias-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mapwrap{position:relative;height:calc(100dvh - 330px);min-height:340px;border-radius:18px;overflow:hidden;background:var(--surface-2);isolation:isolate}
.mapwrap.compact{height:300px;min-height:0}
.map-slot,.map-host{position:absolute;inset:0}
.map-msg{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--muted);font-size:14px}
.leaflet-container{font-family:var(--font-body)}
.leaflet-div-icon.pin-wrap{background:none;border:0}
.pin{box-sizing:border-box;width:100%;height:100%;border-radius:50%;border:2px solid #FFFFFF;box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-weight:700;font-size:14px}
.pin.sel{box-shadow:0 0 0 3px var(--accent),0 2px 8px rgba(0,0,0,.4)}
.cat-dot{flex-shrink:0;border-radius:50%;color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center}
.map-card{position:absolute;left:10px;right:10px;bottom:24px;z-index:1000;background:var(--surface);color:var(--ink);border-radius:16px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:8px}
.mc-top{display:flex;gap:10px;align-items:flex-start}
.mc-top .cat-dot{border-radius:12px}
.mc-name{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mc-name .pname{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.1}
.mc-chips{display:flex;gap:6px;flex-wrap:wrap}
.mc-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;background:var(--surface-2);font-size:13px;font-weight:700}
.mc-note{margin:0;font-size:13px;color:var(--muted)}
.mc-acts{display:flex;gap:8px}
.mc-acts .btn{flex:1;min-height:44px;font-size:14px;padding:0 10px}
.fb{display:inline-block;flex-shrink:0;padding:0 6px;border-radius:5px;font-size:11px;font-weight:700;line-height:18px}
.fb.g{background:var(--ok-bg);color:var(--ok-fg)}
.fb.p{background:var(--surface-2);color:var(--muted)}
.day-strip{position:relative;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.day-strip::-webkit-scrollbar{display:none}
.day-chip{flex-shrink:0;width:64px;min-height:56px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:0}
.day-chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day-chip .dn{font-weight:700;font-size:14px}
.day-chip .dd{font-size:11px;opacity:.85}
.day-chip .dm{height:14px;display:flex;align-items:center}
.day-chip .dm i{width:5px;height:5px;border-radius:50%;background:currentColor;display:block}
.dia-painel{display:flex;flex-direction:column;gap:10px}
.legend-per{margin:0;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:700}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.stops li{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 2px;background:var(--surface);border-radius:14px}
.stops li.dragging{position:relative;z-index:5;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.drag-handle{width:40px;height:44px;flex-shrink:0;border:0;background:none;color:var(--muted);display:grid;place-items:center;cursor:grab;touch-action:none}
.stop-n{width:28px;height:28px;flex-shrink:0;border-radius:50%;color:#FFFFFF;font-weight:700;font-size:14px;display:grid;place-items:center}
.stop-body{flex:1;min-width:0;text-align:left;background:none;border:0;padding:6px 4px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.stop-name{display:flex;align-items:center;gap:6px;min-width:0}
.stop-name .pname{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dia-acts{display:flex;gap:8px;flex-wrap:wrap}
.dia-acts .btn{flex:1;min-height:44px;font-size:14px;white-space:nowrap}
.place.done{opacity:.65}
.tiles.tiles4{grid-template-columns:repeat(4,minmax(0,1fr))}
.pills-col{flex-direction:column;align-items:stretch}
.pills-col .pill-opt{border-radius:12px}
.per-manha{color:var(--per-manha)}
.per-tarde{color:var(--per-tarde)}
.per-noite{color:var(--per-noite)}
.pill-opt.per-manha.on,.chip.per-manha[aria-pressed="true"]{background:var(--per-manha);border-color:var(--per-manha);color:var(--surface)}
.pill-opt.per-tarde.on,.chip.per-tarde[aria-pressed="true"]{background:var(--per-tarde);border-color:var(--per-tarde);color:var(--surface)}
.pill-opt.per-noite.on,.chip.per-noite[aria-pressed="true"]{background:var(--per-noite);border-color:var(--per-noite);color:var(--surface)}
.back-btn{align-self:flex-start;margin-left:-6px;min-height:36px;gap:2px}
.sheet .row{background:var(--surface-2)}
.sheet .row[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.place .body.place-body{flex-direction:row;align-items:center;gap:10px;padding:6px 6px}
.place-body .grow{gap:3px}
.map-card:focus{outline:none}
.map-card:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.mc-note{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mc-acts .btn svg{flex-shrink:0}
.mc-acts .btn{white-space:nowrap;padding:0 8px}
.mc-acts a.btn{flex:0 0 auto;padding:0 12px}
.place-body .stop-name{align-items:flex-start}
.place-body .pname{white-space:normal;overflow-wrap:anywhere}
.place-body .fb{margin-top:2px}
.map-notes{display:flex;flex-direction:column;gap:6px;margin-top:-8px}
.map-notes p{margin:0;font-size:13px;color:var(--muted)}
.inline-link{background:none;border:0;padding:0;color:var(--link);font:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
.stops li.flash{box-shadow:0 0 0 2px var(--accent)}
.stop-body .m{display:flex;align-items:center;gap:4px}
.stop-body .m svg{flex-shrink:0}
.leaflet-control-attribution{font-size:10px}
.leaflet-tile-pane{filter:saturate(.45)}
.sheet-body .fs .chips-wrap .chip{min-height:44px}
.sub-sheet{margin:0 0 4px}
.seg-wide.seg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg3 button{font-size:14px;padding:0 4px}

.busca label{font-size:13px;font-weight:700;color:var(--muted)}
.busca input{min-height:48px;border-radius:14px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit;font-size:16px;width:100%;box-sizing:border-box}
.sh-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

.sh-top{display:flex;align-items:center;gap:8px}
.sh-name{font-family:var(--font-display);font-size:21px;font-weight:700;line-height:1.15;margin-top:2px}
.tag-off{background:var(--surface-2);color:var(--ink)}
.score{margin-left:auto;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--ok-bg);color:var(--ok-fg);white-space:nowrap}
.quando{font-size:13px;font-weight:700}
.quando.ok{color:var(--ok-fg)}
.quando.confira{color:var(--warn-fg)}
.quando.depois{color:var(--muted)}
.sh-acts{display:flex;gap:8px;margin-top:8px}
.sh-acts .btn{flex:1;min-height:44px;font-size:14px;padding:0 10px;white-space:nowrap}
.sh-acts .btn.int[aria-pressed="true"]{background:var(--ok-bg);color:var(--ok-fg);border-color:transparent}
.sh-acts a.btn{flex:0 0 auto}
.stops .stop-n.rank{background:var(--ink);color:var(--bg)}
.stop-body .m .tag{align-self:center}
.cats{list-style:none;margin:0;padding:4px 16px;background:var(--surface);border-radius:18px}
.cats li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.cats li:last-child{border-bottom:0}
.cats .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--ink)}
.meter i.over{background:var(--danger)}
.quota{background:var(--info-bg);color:var(--info-fg);border-radius:18px;padding:16px;gap:8px}
.quota .meter{background:var(--surface);background:color-mix(in srgb,var(--info-fg) 18%,transparent)}
.quota .meter i{background:var(--info-fg)}
.quota p{margin:0;font-size:13px}
.quota h2{margin:0;font-size:16px}

.place{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 4px;background:var(--surface);border-radius:16px}
.place .body{flex:1;min-width:0;text-align:left;background:none;border:0;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;color:var(--ink);border-radius:12px}
.place .cat{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.place.done .name{text-decoration:line-through;color:var(--muted)}
.toggle{min-width:64px;min-height:44px;padding:0 10px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;flex-shrink:0}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.rem{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:14px;padding:4px 4px 4px 4px}
.rem .check-btn{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex-shrink:0}
.rem .body{flex:1;min-width:0;text-align:left;background:none;border:0;padding:8px 10px 8px 2px;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.rem.done .t{text-decoration:line-through;color:var(--muted)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:54px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500}
.tab .ic{width:52px;height:30px;border-radius:15px;display:grid;place-items:center}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"] .ic{background:var(--accent);color:var(--on-accent)}

.overlay{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}

.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:4px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sheet-head h2{margin:0;font-family:var(--font-display);font-size:28px;font-weight:700}
.sheet-head h2:focus{outline:none}
.sheet-body{flex:1;min-height:0;overflow-y:auto;margin:0;padding-top:12px;padding-bottom:16px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.sheet-foot{display:flex;gap:10px;padding-top:12px;padding-bottom:16px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-top:1px solid var(--line)}
.sheet-foot .save{flex:1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.legend{font-size:13px;font-weight:700;color:var(--muted);padding:0}
.hint{font-size:12px;color:var(--muted);margin:0}
.fs{margin:0;padding:0;border:0;min-width:0}
.fs .legend{margin-bottom:8px}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;min-width:0;height:48px;padding:0 14px;border:1.5px solid var(--line-strong);border-radius:12px;font-size:16px;color:var(--ink);background:var(--surface)}
select{padding:0 10px}
textarea{height:auto;min-height:88px;padding:12px 14px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tile{position:relative;min-height:66px;border:1.5px solid var(--line-strong);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;cursor:pointer;padding:6px 2px;text-align:center}
.tile input,.pill-opt input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer}
.tile.on{border-color:var(--ink);background:var(--warn-bg);color:var(--warn-fg)}
.tile:focus-within,.pill-opt:focus-within{outline:3px solid var(--link);outline-offset:2px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill-opt{position:relative;min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--line-strong);display:flex;align-items:center;font-weight:700;font-size:14px;cursor:pointer}
.pill-opt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;cursor:pointer}
.check input{width:22px;height:22px;margin:0;accent-color:var(--ink);flex-shrink:0}
.err{margin:0;color:var(--danger);font-size:14px;font-weight:700}
.trecho{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 44px;gap:8px;align-items:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 18px rgba(0,0,0,.25)}

  /* ---------- armazenamento no aparelho ---------- */
  var STORE_KEY = 'viagem.dados.v1';
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function makeLocalDb() {
    var store;
    try {
      store = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {};
      localStorage.setItem(STORE_KEY + '.teste', '1');
      localStorage.removeItem(STORE_KEY + '.teste');
    } catch (e) { return null; }
    var listeners = [];
    function emit() { listeners.slice().forEach(function (l) { l(); }); }
    function snapDoc(path) {
      var d = store[path];
      return { id: path.split('/').pop(), exists: !!d, data: function () { return d ? clone(d) : undefined; }, metadata: { fromCache: false, hasPendingWrites: false } };
    }
    function write(fn) {
      return new Promise(function (resolve, reject) {
        var before = JSON.stringify(store);
        try { fn(); localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
        catch (e) { store = JSON.parse(before); reject({ code: (e && e.code === 'invalid_argument') ? 'invalid_argument' : 'quota_exceeded', message: String(e && e.message || e) }); return; }
        emit(); resolve();
      });
    }
    function listen(fn) { listeners.push(fn); setTimeout(fn, 0); return function () { listeners = listeners.filter(function (x) { return x !== fn; }); }; }
    function docRef(path) {
      return {
        id: path.split('/').pop(), path: path,
        get: function () { return Promise.resolve(snapDoc(path)); },
        set: function (data) { return write(function () { store[path] = clone(data); }); },
        update: function (data) { return write(function () { if (!store[path]) throw { code: 'invalid_argument' }; Object.assign(store[path], clone(data)); }); },
        delete: function () { return write(function () { delete store[path]; }); },
        onSnapshot: function (next) { return listen(function () { next(snapDoc(path)); }); }
      };
    }
    function colRef(name) {
      return {
        path: name,
        doc: function (id) { return docRef(name + '/' + (id || newId())); },
        onSnapshot: function (next) {
          return listen(function () {
            var docs = Object.keys(store).filter(function (k) { return k.indexOf(name + '/') === 0 && k.split('/').length === 2; }).sort().map(snapDoc);
            next({ docs: docs, size: docs.length, empty: !docs.length });
          });
        }
      };
    }
    window.addEventListener('storage', function (e) {
      if (e.key !== STORE_KEY) return;
      try { store = JSON.parse(e.newValue || '{}') || {}; } catch (x) {}
      emit();
    });
    return {
      doc: docRef, collection: colRef,
      exportAll: function () { return clone(store); },
      importAll: function (obj) { return write(function () { store = clone(obj); }); }
    };
  }

  function viewGastos() {

  /* ---------- Lugares ---------- */
  /* ---------- lugares: mapa, lista e roteiro por dia ---------- */
  function hasGeo(p) { return typeof p.lat === 'number' && typeof p.lng === 'number' && isFinite(p.lat) && isFinite(p.lng); }
  function perOf(p) { return PERIODOS[p.periodo] ? p.periodo : ''; }
  function anyOn(o) { for (var k in o) { if (o[k]) return true; } return false; }
  function filtroCount() {
    var f = S.mapFilter, n = 0;
    ['cat', 'preco', 'per', 'rot'].forEach(function (g) { for (var k in f[g]) { if (f[g][k]) n++; } });
    return n;
  }
  function passaFiltro(p) {
    var f = S.mapFilter;
    if (anyOn(f.cat) && !f.cat[catOf(p)]) return false;
    if (anyOn(f.preco) && !f.preco[p.entrada === 'gratis' ? 'gratis' : p.entrada === 'pago' ? 'pago' : '-']) return false;
    if (anyOn(f.per) && !f.per[perOf(p) || '-']) return false;
    if (anyOn(f.rot) && !f.rot[isDate(p.dia) ? 'com' : 'sem']) return false;
    return true;
  }
  function diaOk(d) { return isDate(d) && !!(S.diasOk && S.diasOk[d]); }
  function ordemOf(p) { var n = Number(p.ordem); return n > 0 ? n : 999; }
  function lugaresDoDia(d) {
    return of('lugar').filter(function (p) { return p.dia === d; }).sort(function (a, b) {
      return (ordemOf(a) - ordemOf(b)) || String(a.titulo || '').localeCompare(String(b.titulo || ''), 'pt-BR');
    });
  }
  function proximaOrdem(d, skipId) {
    return lugaresDoDia(d).filter(function (p) { return p.id !== skipId; }).reduce(function (m, p) { return Math.max(m, Number(p.ordem) > 0 ? Number(p.ordem) : 0); }, 0) + 1;
  }
  function diasMapa() {
    var days = tripDays(S.config);
    of('lugar').forEach(function (p) { if (isDate(p.dia) && days.indexOf(p.dia) < 0) days.push(p.dia); });
    return days.sort();
  }
  function dayNum(d) { var i = diasMapa().indexOf(d); return i >= 0 ? i + 1 : ''; }
  function dayLabel(d) { var n = dayNum(d); return (n ? 'Dia ' + n + ' · ' : '') + shortDate(d); }
  function byTitulo(a, b) { return String(a.titulo || '').localeCompare(String(b.titulo || ''), 'pt-BR'); }
  function catDot(p, size, cat) {
    var c = CAT_INFO[cat || catOf(p)];
    return '<span class="cat-dot" style="width:' + size + 'px;height:' + size + 'px;background:' + c.color + '" aria-hidden="true">' + pathSvg(c.d, Math.round(size * 0.52), 2.2) + '</span>';
  }
  function freeBadge(p) {
    if (p.entrada === 'gratis') return '<span class="fb g">grátis</span>';
    if (p.entrada === 'pago') return '<span class="fb p"><span aria-hidden="true">$</span><span class="sr">pago</span></span>';
    return '';
  }
  function pname(p, extraCls) {
    var per = perOf(p);
    return '<span class="pname' + (extraCls ? ' ' + extraCls : '') + (per ? ' per-' + per : '') + '">' + esc(p.titulo) + '</span>';
  }
  function gmaps(p) {
    var q = [p.titulo, p.local || 'New York'].filter(Boolean).join(', ');
    return 'https://www.google.com/maps/search/?api=1&amp;query=' + encodeURIComponent(q);
  }
  function lugaresHeader(all) {
    var comDia = all.filter(function (p) { return isDate(p.dia); }).length;
    var sub = all.length ? all.length + (all.length === 1 ? ' lugar' : ' lugares') + ' · ' + comDia + ' com dia' : '';
    return header('', 'Lugares', sub,
      (all.length ? '<button type="button" class="dias-btn" data-action="map-mode" data-m="dias" aria-label="Dias do roteiro">' + I.cal + 'Dias</button>' : '') +
      addBtn('lugar', '', 'Adicionar lugar'));
  }
  function lugaresTools() {
    var fc = filtroCount();
    return '<div class="map-tools">' +
      '<div class="seg" role="group" aria-label="Ver lugares como">' +
      '<button type="button" data-action="lug-view" data-v="mapa" aria-pressed="' + (S.lugaresView === 'mapa') + '">Mapa</button>' +
      '<button type="button" data-action="lug-view" data-v="lista" aria-pressed="' + (S.lugaresView === 'lista') + '">Lista</button></div>' +
      '<button type="button" class="chip chip-ic" data-action="filtros" aria-pressed="' + (fc > 0) + '">' + I.filter + 'Filtros' +
      (fc ? '<span class="n">' + fc + '</span>' : '') + '</button></div>';
  }
  function mapMsg() {
    if (leafletState === 'ok') return '';
    return '<div class="map-msg" role="status">' + (leafletState === 'erro'
      ? 'O mapa precisa de internet pra abrir da primeira vez. A lista continua funcionando.'
      : 'Carregando o mapa…') + '</div>';
  }
  function placeCard(p) {
    var per = perOf(p);
    var chips = [];
    if (per) chips.push('<span class="mc-chip per-' + per + '">' + pathSvg(PERIODOS[per].d, 14, 2.2) + PERIODOS[per].label + '</span>');
    chips.push('<span class="mc-chip">' + esc(isDate(p.dia) ? dayLabel(p.dia) : 'Sem dia') + '</span>');
    if (p.entrada === 'pago' && p.preco) chips.push('<span class="mc-chip">' + esc(p.preco) + '</span>');
    return '<div class="map-card" tabindex="-1" role="region" aria-label="' + esc(p.titulo) + '">' +

      '<button type="button" class="icon-btn soft" data-action="map-unsel" aria-label="Fechar detalhes">' + I.x + '</button></div>' +
      '<div class="mc-chips">' + chips.join('') + '</div>' +
      (p.nota ? '<p class="mc-note">' + esc(p.nota) + '</p>' : '') +
      '<div class="mc-acts">' +
      '<button type="button" class="btn ghost" data-action="pordia" data-id="' + esc(p.id) + '">' + (isDate(p.dia) ? 'Trocar dia' : 'Pôr num dia') + '</button>' +
      '<button type="button" class="btn ghost" data-action="edit" data-id="' + esc(p.id) + '">Editar</button>' +
      '<a class="btn ghost" href="' + gmaps(p) + '" target="_blank" rel="noopener" aria-label="Abrir ' + esc(p.titulo) + ' no Google Maps">' + I.ext + 'Maps</a>' +
      '</div></div>';
  }

  /* ---------- motor do mapa (Leaflet) ---------- */
  var LEAFLET_JS = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';

  function pinIcon(p, n, sel) {

    var inner = n ? String(n) : pathSvg(c.d, sel ? 19 : 16, 2.2);
    return L.divIcon({
      className: 'pin-wrap',
      html: '<div class="pin' + (sel ? ' sel' : '') + '" style="background:' + c.color + '">' + inner + '</div>',
      iconSize: [size, size], iconAnchor: [size / 2, size / 2]

  }
  function corLinha(props) {
    var keys = ['service', 'route', 'route_id', 'rt_symbol', 'line', 'service_name', 'name', 'routes'];
    var cands = [];
    keys.forEach(function (k) { if (props[k] != null) cands.push(String(props[k])); });
    Object.keys(props).forEach(function (k) { if (typeof props[k] === 'string' && props[k].length <= 12) cands.push(props[k]); });
    for (var i = 0; i < cands.length; i++) {
      var tok = cands[i].trim().toUpperCase().split(/[\s,\-\/]+/)[0];

  }
  function carregarMetro() {
    if (MAP.buscandoMetro || (MAP.linhasOk && MAP.estacoesOk) || !MAP.map) return;
    MAP.buscandoMetro = true;
    var jobs = [];
    if (!MAP.linhasOk) {
      jobs.push(fetch(METRO_LINHAS).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (gj) {
        if (!gj || !gj.features || !gj.features.length) throw 0;
        L.geoJSON(gj, {
          interactive: false,
          style: function (f) { return { color: corLinha((f && f.properties) || {}), weight: 3, opacity: 0.75 }; }
        }).addTo(MAP.metro);
        MAP.linhasOk = true;
      }).catch(function () {}));
    }
    if (!MAP.estacoesOk) {
      jobs.push(fetch(METRO_ESTACOES).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (rows) {
        if (!Array.isArray(rows) || !rows.length) throw 0;
        var vistos = {};
        rows.forEach(function (r) {
          var lat = Number(r.gtfs_latitude || r.latitude), lng = Number(r.gtfs_longitude || r.longitude);
          var nome = r.stop_name || r.station_name || r.name || '';
          if (!isFinite(lat) || !isFinite(lng) || !lat || !nome) return;
          var k = nome + '|' + lat.toFixed(3) + ',' + lng.toFixed(3);
          if (vistos[k]) return;
          vistos[k] = true;
          var linhas = String(r.daytime_routes || r.routes || '').trim();
          L.circleMarker([lat, lng], { radius: 4.5, color: '#14151A', weight: 1.5, fillColor: '#FFFFFF', fillOpacity: 1 })

            .addTo(MAP.estacoes);
        });

      }).catch(function () {}));
    }
    Promise.all(jobs).then(function () { MAP.buscandoMetro = false; });
  }
  function mostrarEstacoes() {
    if (!MAP.map) return;

  }
  function criarMapa() {
    var map = L.map(MAP.host, { zoomControl: true, minZoom: 10, maxZoom: 18 });

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · metrô: MTA'

    MAP.metro = L.layerGroup().addTo(map);
    MAP.estacoes = L.layerGroup();
    MAP.rota = L.layerGroup().addTo(map);
    MAP.pins = L.layerGroup().addTo(map);

  function pinClick(id) {
    if (MAPDATA && MAPDATA.modo === 'dias') {

  function desenharMapa() {
    var d = MAPDATA, map = MAP.map;
    var key = d.modo + '|' + (d.dia || '') + '|' + (d.sel || '') + '|' + d.pins.map(function (x) {
      return x.p.id + ':' + x.p.lat + ',' + x.p.lng + ':' + catOf(x.p) + ':' + x.n + ':' + x.p.titulo;

  /* ---------- achar endereço no mapa (OpenStreetMap / Nominatim) ---------- */
  var GEO = { busy: false, tried: {} };
  function distM(a1, o1, a2, o2) {
    var r = Math.PI / 180, x = (o2 - o1) * r * Math.cos((a1 + a2) / 2 * r), y = (a2 - a1) * r;
    return Math.sqrt(x * x + y * y) * 6371000;
  }
  function precisaGeo(p) { return p.tipo === 'lugar' && ((!hasGeo(p) && p.geo !== 'falhou') || p.geo === 'aprox'); }
  function esperar(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function geocodeFila() {
    if (GEO.busy || !dbRef || (typeof navigator.onLine === 'boolean' && !navigator.onLine)) return;
    GEO.busy = true;
    try {
      for (var guard = 0; guard < 80; guard++) {
        var p = S.items.find(function (x) { return precisaGeo(x) && !GEO.tried[x.id + '|' + (x.local || '') + '|' + x.titulo]; });
        if (!p) break;
        GEO.tried[p.id + '|' + (p.local || '') + '|' + p.titulo] = true;
        var base = String(p.local || '').trim() || p.titulo;
        var q = /new york|brooklyn|queens|bronx|staten|\bny\b|manhattan/i.test(base) ? base : base + ', New York';
        var hit = null, ok = true;
        try {
          var r = await fetchJson('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=us&viewbox=-74.26,40.92,-73.68,40.49&bounded=1&q=' + encodeURIComponent(q));
          hit = Array.isArray(r) && r[0] ? r[0] : null;
        } catch (e) { ok = false; }
        if (ok) {
          var upd;
          var lat = hit ? Number(hit.lat) : NaN, lng = hit ? Number(hit.lon) : NaN;
          if (hit && isFinite(lat) && isFinite(lng)) {
            if (hasGeo(p) && distM(p.lat, p.lng, lat, lng) > 1500) upd = { geo: 'ok' };
            else upd = { lat: lat, lng: lng, geo: 'ok' };
          } else {
            upd = hasGeo(p) ? { geo: 'ok' } : { geo: 'falhou' };
          }
          try { await dbRef.doc('itens/' + p.id).update(upd); } catch (e) {}
        }
        await esperar(1100);
      }
    } finally { GEO.busy = false; }
  }

  /* ---------- lugares da lista do Google Maps ---------- */
  function normTitulo(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
  async function importarSeed() {
    var v = 0;
    try { v = Number(localStorage.getItem('viagem.seed')) || 0; } catch (e) {}
    if (v >= SEED_VERSAO || !SEED_LUGARES.length || !dbRef) return;
    remember('viagem.seed', String(SEED_VERSAO));
    var existentes = of('lugar').map(function (p) { return normTitulo(p.titulo); });
    var now = Date.now(), n = 0;
    S.pausa = true;
    try {
      for (var k = 0; k < SEED_LUGARES.length; k++) {
        var s = SEED_LUGARES[k], nn = normTitulo(s.titulo);
        var dup = existentes.some(function (e) { return e === nn || (e.length > 5 && nn.length > 5 && (e.indexOf(nn) >= 0 || nn.indexOf(e) >= 0)); });
        if (dup) continue;
        var out = Object.assign({ tipo: 'lugar', nota: '', dia: '', ordem: 0, periodo: '', entrada: '', preco: '', criadoEm: now + k, atualizadoEm: now + k }, clone(s));
        await dbRef.collection('itens').doc().set(out);
        n++;
      }
    } catch (e) { toast(writeError(e)); }
    S.pausa = false;
    render();
    if (n) toast(n + (n === 1 ? ' lugar da sua lista entrou' : ' lugares da sua lista entraram') + ' no app');
  }

  /* ---------- ações dos lugares ---------- */
  async function setDia(id, dia) {

    try { await dbRef.doc('itens/' + id).update(upd); return true; }
    catch (e) { toast(writeError(e)); return false; }
  }
  async function salvarOrdem(ids, campo) {
    if (!dbRef) return;
    campo = campo === 'rank' ? 'rank' : 'ordem';
    S.pausa = true;
    try {
      for (var k = 0; k < ids.length; k++) {
        var it = S.items.find(function (x) { return x.id === ids[k]; });
        var upd = {}; upd[campo] = k + 1;
        if (it && Number(it[campo]) !== k + 1) await dbRef.doc('itens/' + ids[k]).update(upd);
      }
    } catch (e) { toast(writeError(e)); }
    S.pausa = false;
    render();
  }
  async function toggleDiaOk(d) {

      await dbRef.doc('viagem/dias').set({ confirmados: next, atualizadoEm: Date.now() });

  function renumerar(ol) {

  function readItemForm() {
    var f = document.getElementById('sheet-form');
    var d = clone(sheet.draft);
    if (!f) return d;
    var tipoEl = f.querySelector('input[name="tipo"]:checked');
    if (tipoEl) d.tipo = tipoEl.value;
    ['titulo', 'dia', 'hora', 'local', 'valor', 'moeda', 'assento', 'categoria', 'nota', 'preco', 'periodo', 'entrada'].forEach(function (k) {
      var el = f.elements.namedItem(k);
      if (el && el.value !== undefined) d[k] = el.value;
    });
    var stEl = f.querySelector('input[name="status"]:checked');
    if (stEl) d.status = stEl.value;
    ['contaGasto', 'cota', 'feito'].forEach(function (k) {
      var el = f.elements.namedItem(k);
      if (el) d[k] = el.checked;
    });
    return d;
  }
  function readSettingsForm() {
    var f = document.getElementById('sheet-form');
    var c = clone(sheet.draft);
    if (!f) return c;
    c.nome = f.elements.namedItem('nome').value;
    c.inicio = f.elements.namedItem('inicio').value;
    c.fim = f.elements.namedItem('fim').value;
    c.cotacao = f.elements.namedItem('cotacao').value;
    c.cotacaoAuto = f.elements.namedItem('cotacaoAuto').checked;
    c.iof = f.elements.namedItem('iof').value;
    c.trechos = Array.prototype.map.call(f.querySelectorAll('.trecho'), function (row) {
      return { cidade: row.querySelector('.tr-cidade').value, desde: row.querySelector('.tr-desde').value };
    });
    c.orcamento = {};
    GASTO_CATS.forEach(function (cat, i) { var v = f.elements.namedItem('orc' + i).value; c.orcamento[cat] = v; });
    return c;

  function showErr(msg) {
    var e = document.getElementById('f-err');
    if (e) { e.textContent = msg; e.hidden = false; e.scrollIntoView({ block: 'center' }); }
  }
  function setSaving(on) {
    var b = document.getElementById('save-btn');
    if (b) { b.disabled = on; b.textContent = on ? 'Salvando…' : (b.getAttribute('data-label') || 'Salvar'); }
  }
  function writeError(e) {
    var code = e && e.code;
    if (code === 'quota_exceeded') return 'O celular não deixou salvar (espaço cheio ou navegador bloqueando). Tente de novo.';
    if (code === 'revoked' || code === 'not_granted') return 'Você não tem permissão para salvar neste app.';
    return 'Não deu para salvar. Confira a conexão e tente de novo.';
  }
  async function getDb() {
    var db = await dbReady;
    if (!db) { toast('Este navegador não está deixando o app salvar dados. Abra no Chrome, fora da aba anônima.'); }
    return db;
  }
  async function saveItem() {
    var d = readItemForm();
    sheet.draft = d;
    var titulo = String(d.titulo || '').trim();
    if (!titulo) return showErr('Dê um nome para o item.');
    var out = { tipo: d.tipo, titulo: titulo, nota: String(d.nota || '').trim(), criadoEm: d.criadoEm || Date.now(), atualizadoEm: Date.now() };
    var t = d.tipo;
    if (t === 'show' || t === 'programa' || t === 'lembrete' || t === 'gasto' || t === 'lugar') out.dia = isDate(d.dia) ? d.dia : '';
    if (t === 'show' || t === 'programa' || t === 'lembrete') out.hora = /^\d{2}:\d{2}$/.test(d.hora || '') ? d.hora : '';
    if (t === 'show' || t === 'programa' || t === 'lugar') out.local = String(d.local || '').trim();
    if (t === 'show') {
      out.status = STATUS[d.status] ? d.status : 'quero';
      out.valor = parseMoney(d.valor);
      out.moeda = d.moeda === 'BRL' ? 'BRL' : 'USD';
      out.assento = String(d.assento || '').trim();
      out.contaGasto = d.contaGasto !== false;
      out.cotacao = num(d.cotacao) > 0 ? num(d.cotacao) : rate();
      var origS = sheet.id ? S.items.find(function (x) { return x.id === sheet.id; }) : null;
      if (origS && origS.catalogo) out.catalogo = origS.catalogo;
      out.rank = origS && Number(origS.rank) > 0 ? Number(origS.rank) : proximoRank();
    }
    if (t === 'gasto') {
      var v = parseMoney(d.valor);
      if (!(v > 0)) return showErr('Coloque o valor do gasto.');
      out.valor = v;
      out.moeda = d.moeda === 'BRL' ? 'BRL' : 'USD';
      out.categoria = GASTO_CATS.indexOf(d.categoria) >= 0 ? d.categoria : 'Outros';
      if (out.categoria === 'Compras') out.cota = d.cota !== false;
      out.cotacao = num(d.cotacao) > 0 ? num(d.cotacao) : rate();
    }
    if (t === 'lugar') {
      out.categoria = CAT_INFO[d.categoria] ? d.categoria : catOf(d);
      out.periodo = PERIODOS[d.periodo] ? d.periodo : '';
      out.entrada = d.entrada === 'gratis' || d.entrada === 'pago' ? d.entrada : '';
      out.preco = out.entrada === 'pago' ? String(d.preco || '').trim() : '';
      var orig = sheet.id ? S.items.find(function (x) { return x.id === sheet.id; }) : null;
      var mesmoLugar = orig && orig.tipo === 'lugar' && String(orig.local || '').trim() === out.local &&
        (out.local || String(orig.titulo || '').trim() === titulo);
      if (mesmoLugar && hasGeo(orig)) { out.lat = orig.lat; out.lng = orig.lng; out.geo = orig.geo === 'aprox' ? 'aprox' : 'ok'; }
      else if (mesmoLugar && orig.geo === 'falhou') out.geo = 'falhou';
      if (out.dia && orig && orig.dia === out.dia && Number(orig.ordem) > 0) out.ordem = Number(orig.ordem);
      else out.ordem = out.dia ? proximaOrdem(out.dia, sheet.id) : 0;
    }
    if (t === 'lembrete') out.feito = !!d.feito;
    var db = await getDb();
    if (!db) return;
    setSaving(true);
    var wasEdit = !!sheet.id;
    try {
      var ref = wasEdit ? db.doc('itens/' + sheet.id) : db.collection('itens').doc();
      await ref.set(out);
      if (t === 'show' || t === 'programa' || t === 'lembrete' || t === 'lugar') { if (out.dia) S.day = out.dia; }
      closeSheet();
      toast(wasEdit ? 'Atualizado' : 'Salvo');
    } catch (e) {
      setSaving(false);
      showErr(writeError(e));
    }
  }
  async function saveSettings() {
    var c = readSettingsForm();
    sheet.draft = c;
    if (!isDate(c.inicio) || !isDate(c.fim)) return showErr('Preencha o começo e o fim da viagem.');
    if (c.fim < c.inicio) return showErr('O fim precisa ser depois do começo.');
    if (diffDays(c.inicio, c.fim) > 119) return showErr('A viagem pode ter no máximo 120 dias.');
    var out = {
      nome: String(c.nome || '').trim() || 'Minha viagem',
      inicio: c.inicio, fim: c.fim,
      trechos: c.trechos.filter(function (t) { return String(t.cidade || '').trim(); })
        .map(function (t) { return { cidade: String(t.cidade).trim(), desde: isDate(t.desde) ? t.desde : c.inicio }; }),
      cotacao: parseMoney(c.cotacao) > 0 ? parseMoney(c.cotacao) : DEFAULT_CONFIG.cotacao,
      cotacaoAuto: !!c.cotacaoAuto,
      iof: (parseMoney(c.iof) !== null && parseMoney(c.iof) >= 0) ? parseMoney(c.iof) : DEFAULT_CONFIG.iof,
      orcamento: {},
      atualizadoEm: Date.now()
    };
    GASTO_CATS.forEach(function (cat) { var v = parseMoney(c.orcamento[cat]); if (v > 0) out.orcamento[cat] = v; });
    var db = await getDb();
    if (!db) return;
    setSaving(true);
    try {
      await db.doc('viagem/config').set(out);
      closeSheet();
      toast('Ajustes salvos');
    } catch (e) {
      setSaving(false);
      showErr(writeError(e));
    }
  }
  async function deleteItem() {
    if (!sheet || !sheet.id) return;
    if (!sheet.armed) {
      sheet.draft = readItemForm();
      sheet.armed = true;
      renderSheet(false);
      var b = sheetRoot.querySelector('[data-action="delete"]');
      if (b) b.focus();
      setTimeout(function () {
        if (sheet && sheet.armed) { sheet.draft = readItemForm(); sheet.armed = false; renderSheet(false); }
      }, 4000);
      return;
    }
    var db = await getDb();
    if (!db) return;
    var id = sheet.id;
    try {
      await db.doc('itens/' + id).delete();
      closeSheet();
      toast('Apagado');
    } catch (e) {
      showErr(writeError(e));
    }
  }
  async function toggleFeito(id) {
    var it = S.items.find(function (x) { return x.id === id; });
    if (!it) return;
    var db = await getDb();
    if (!db) return;
    try { await db.doc('itens/' + id).update({ feito: !it.feito, atualizadoEm: Date.now() }); }

  }

  /* ---------- simulação ---------- */
  async function simAdd() {
    var nomeEl = document.getElementById('sim-nome'), valEl = document.getElementById('sim-valor'), err = document.getElementById('sim-err');
    if (!nomeEl || !valEl) return;
    var nome = String(nomeEl.value || '').trim(), v = parseMoney(valEl.value);
    function fail(m, el) { if (err) { err.textContent = m; err.hidden = false; } el.focus(); }
    if (!nome) return fail('Escreva o nome do item.', nomeEl);
    if (!(v > 0)) return fail('Coloque o valor.', valEl);
    var db = await getDb();
    if (!db) return;
    nomeEl.value = ''; valEl.value = '';
    if (err) err.hidden = true;
    nomeEl.focus();
    try { await db.collection('simulacao').doc().set({ nome: nome, valor: v, moeda: S.simCur, marcado: true, criadoEm: Date.now() }); }
    catch (e) { toast(writeError(e)); }
  }
  async function simSet(id, val) {
    var db = await getDb();
    if (!db) return;
    try { await db.doc('simulacao/' + id).update({ marcado: !!val }); } catch (e) { toast(writeError(e)); }
  }
  async function simAll(val) {
    var db = await getDb();
    if (!db) return;
    var ids = S.sim.filter(function (i) { return !!i.marcado !== val; }).map(function (i) { return i.id; });
    try { for (var k = 0; k < ids.length; k++) await db.doc('simulacao/' + ids[k]).update({ marcado: val }); }
    catch (e) { toast(writeError(e)); }
  }
  async function simRm(id) {
    var db = await getDb();
    if (!db) return;
    try { await db.doc('simulacao/' + id).delete(); toast('Item tirado da simulação'); } catch (e) { toast(writeError(e)); }
  }
  async function saveLancar() {
    var f = document.getElementById('sheet-form');
    var items = sheet.ids.map(function (id) { return S.sim.find(function (x) { return x.id === id; }); }).filter(Boolean);
    if (!f || !items.length) { closeSheet(); return; }
    var dia = f.elements.namedItem('dia').value;
    var tirar = f.elements.namedItem('tirar').checked;
    var cats = items.map(function (i, k) { var c = f.elements.namedItem('cat' + k).value; return GASTO_CATS.indexOf(c) >= 0 ? c : 'Outros'; });
    var db = await getDb();
    if (!db) return;
    setSaving(true);
    var r = rate(), now = Date.now();
    try {
      for (var k = 0; k < items.length; k++) {
        var i = items[k];
        var out = {
          tipo: 'gasto', titulo: i.nome, nota: '', dia: isDate(dia) ? dia : '',
          valor: num(i.valor), moeda: i.moeda === 'BRL' ? 'BRL' : 'USD', categoria: cats[k],
          cotacao: r, criadoEm: now + k, atualizadoEm: now + k
        };
        if (out.categoria === 'Compras') out.cota = true;
        await db.collection('itens').doc().set(out);
        if (tirar) await db.doc('simulacao/' + i.id).delete();
      }
      var n = items.length;
      closeSheet();
      S.gastosTab = 'lancados'; remember('viagem.gastosTab', 'lancados');
      render();
      toast(n === 1 ? '1 gasto lançado' : n + ' gastos lançados');
    } catch (e) {
      setSaving(false);
      showErr(writeError(e));
    }
  }

  /* ---------- backup ---------- */
  async function exportBackup() {
    var db = await getDb();
    if (!db) return;
    var payload = { app: 'viagem-ny', versao: 1, exportadoEm: new Date().toISOString(), dados: db.exportAll() };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'viagem-backup-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Backup baixado');
  }
  function readImport(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var obj = null;
      try { obj = JSON.parse(String(reader.result || '')); } catch (e) {}
      if (!obj || obj.app !== 'viagem-ny' || !obj.dados || typeof obj.dados !== 'object') {
        showErr('Esse arquivo não é um backup deste app.');
        return;
      }
      var count = Object.keys(obj.dados).filter(function (k) { return k.indexOf('itens/') === 0; }).length;
      sheet.draft = readSettingsForm();
      sheet.importData = { dados: obj.dados, count: count };
      renderSheet(false);
    };
    reader.onerror = function () { showErr('Não consegui ler o arquivo.'); };
    reader.readAsText(file);
  }
  async function confirmImport() {
    if (!sheet || !sheet.importData) return;
    var db = await getDb();
    if (!db) return;
    try {
      await db.importAll(sheet.importData.dados);
      closeSheet();
      toast('Backup restaurado');
    } catch (e) { showErr(writeError(e)); }
  }

  /* ---------- aviso rápido ---------- */
  var toastEl = document.getElementById('toast'), toastT;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.hidden = true; }, 2600);
  }

  /* ---------- eventos ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var a = el.getAttribute('data-action');
    if (a === 'new') { openItem(null, { tipo: el.getAttribute('data-tipo') || 'show', dia: el.getAttribute('data-dia') || '' }); }
    else if (a === 'edit') { openItem(el.getAttribute('data-id')); }
    else if (a === 'settings') { openSettings(); }
    else if (a === 'close-sheet') { closeSheet(); }
    else if (a === 'delete') { deleteItem(); }
    else if (a === 'toggle-feito') { toggleFeito(el.getAttribute('data-id')); }
    else if (a === 'toggle-done') { S.showDone = !S.showDone; render(); }
    else if (a === 'day') { S.day = el.getAttribute('data-dia'); render(); var b = appEl.querySelector('[data-action="day"][data-dia="' + S.day + '"]'); if (b) b.focus(); }
    else if (a === 'show-filter') { S.showFilter = el.getAttribute('data-f'); render(); }
    else if (a === 'place-filter') { S.placeFilter = el.getAttribute('data-f'); render(); }
    else if (a === 'shows-tab') {
      var tt = el.getAttribute('data-t');
      S.showsTab = tt === 'buscar' || tt === 'interesse' ? tt : 'meus';
      remember('viagem.showsTab', S.showsTab);
      render();
      var tb = appEl.querySelector('[data-action="shows-tab"][data-t="' + S.showsTab + '"]'); if (tb) tb.focus();
    }
    else if (a === 'busca-tipo') {
      S.buscaTipo = el.getAttribute('data-t');
      render();
      var bt = appEl.querySelector('[data-action="busca-tipo"][data-t="' + S.buscaTipo + '"]'); if (bt) bt.focus();
    }
    else if (a === 'interesse') {
      var cid = el.getAttribute('data-cat');
      toggleInteresse(cid).then(function () {
        var ib = appEl.querySelector('[data-action="interesse"][data-cat="' + cid + '"]'); if (ib) ib.focus({ preventScroll: true });
      });
    }
    else if (a === 'interesse-novo') {
      var nq = String(S.buscaShow || '').trim();
      if (nq) novoInteresse(nq, null).then(function () { S.buscaShow = ''; render(); });
    }
    else if (a === 'lug-view') {
      S.lugaresView = el.getAttribute('data-v') === 'lista' ? 'lista' : 'mapa';
      remember('viagem.lugaresView', S.lugaresView);
      render();
      var vb = appEl.querySelector('[data-action="lug-view"][data-v="' + S.lugaresView + '"]'); if (vb) vb.focus();
    }

      if (S.mapModo === 'dias') S.lugaresView = 'mapa';
      S.mapSel = null;
      render();
      window.scrollTo(0, 0);
      var mh = appEl.querySelector('h1'); if (mh) { mh.setAttribute('tabindex', '-1'); mh.focus({ preventScroll: true }); }
    }
    else if (a === 'map-day') {
      S.mapDay = el.getAttribute('data-dia');
      render();
      var db2 = appEl.querySelector('[data-action="map-day"][data-dia="' + S.mapDay + '"]'); if (db2) db2.focus({ preventScroll: true });
    }
    else if (a === 'map-unsel') { S.mapSel = null; render(); }
    else if (a === 'ver-no-mapa') {
      S.lugaresView = 'mapa'; S.mapModo = 'todos'; S.mapSel = el.getAttribute('data-id'); MAP.focarCard = true;
      remember('viagem.lugaresView', 'mapa');
      render();
      window.scrollTo(0, 0);
    }
    else if (a === 'pordia') { openPick('pordia', { id: el.getAttribute('data-id') }); }
    else if (a === 'set-dia') {
      var alvoDia = el.getAttribute('data-dia');
      if (!sheet || !sheet.id) return;
      setDia(sheet.id, alvoDia).then(function (ok) {
        if (!ok) return;
        closeSheet();
        toast(alvoDia ? 'Foi pro ' + dayLabel(alvoDia) : 'Saiu do roteiro');
      });
    }
    else if (a === 'parada') { if (S.mapDay) openPick('parada', { dia: S.mapDay }); }
    else if (a === 'add-parada') {
      var pid = el.getAttribute('data-id');
      if (!sheet || sheet.kind !== 'parada') return;
      setDia(pid, sheet.dia).then(function (ok) {
        if (!ok || !sheet || sheet.kind !== 'parada') return;
        renderSheet(false);
        var nx = sheetRoot.querySelector('[data-action="add-parada"]') || sheetRoot.querySelector('.sheet-foot .btn');
        if (nx) nx.focus();
        var it = S.items.find(function (x) { return x.id === pid; });
        toast((it ? it.titulo : 'Lugar') + ' entrou no dia');
      });
    }
    else if (a === 'confirmar-dia') { toggleDiaOk(el.getAttribute('data-dia')); }
    else if (a === 'filtros') { openPick('filtros'); }
    else if (a === 'mf') {
      var g = el.getAttribute('data-g'), k = el.getAttribute('data-k');
      if (!S.mapFilter[g]) return;
      S.mapFilter[g][k] = !S.mapFilter[g][k];
      if (!S.mapFilter[g][k]) delete S.mapFilter[g][k];
      remember('viagem.mapFilter', JSON.stringify(S.mapFilter));
      S.mapSel = null;
      render();

        renderSheet(false);
        var fb = sheetRoot.querySelector('[data-action="mf"][data-g="' + g + '"][data-k="' + k + '"]'); if (fb) fb.focus();

      S.mapFilter = { cat: {}, preco: {}, per: {}, rot: {} };
      remember('viagem.mapFilter', JSON.stringify(S.mapFilter));
      render();
      if (sheet && sheet.kind === 'filtros') renderSheet(false);
    }
    else if (a === 'cur') { S.cur = el.getAttribute('data-cur'); try { localStorage.setItem('viagem.cur', S.cur); } catch (x) {} render(); }
    else if (a === 'goto') { location.hash = el.getAttribute('data-view'); }
    else if (a === 'gastos-tab') { S.gastosTab = el.getAttribute('data-t') === 'simular' ? 'simular' : 'lancados'; remember('viagem.gastosTab', S.gastosTab); render(); }
    else if (a === 'sim-cur') { S.simCur = el.getAttribute('data-cur') === 'BRL' ? 'BRL' : 'USD'; remember('viagem.simCur', S.simCur); render(); }
    else if (a === 'sim-all') { simAll(true); }
    else if (a === 'sim-none') { simAll(false); }
    else if (a === 'sim-rm') { simRm(el.getAttribute('data-id')); }
    else if (a === 'lancar') { openLancar(); }
    else if (a === 'refresh-rate') { refreshRate(); }
    else if (a === 'export') { exportBackup(); }
    else if (a === 'import-confirm') { confirmImport(); }
    else if (a === 'import-cancel') { sheet.draft = readSettingsForm(); sheet.importData = null; renderSheet(false); }
    else if (a === 'add-trecho') {
      sheet.draft = readSettingsForm(); sheet.draft.trechos.push({ cidade: '', desde: '' }); renderSheet(false);
      var rows = sheetRoot.querySelectorAll('.tr-cidade'); if (rows.length) rows[rows.length - 1].focus();
    }
    else if (a === 'rm-trecho') {
      sheet.draft = readSettingsForm(); sheet.draft.trechos.splice(Number(el.getAttribute('data-i')), 1);
      if (!sheet.draft.trechos.length) sheet.draft.trechos.push({ cidade: '', desde: '' });
      renderSheet(false);
    }
  });

    }
  });
  document.addEventListener('change', function (e) {
    var simId = e.target.getAttribute && e.target.getAttribute('data-sim-toggle');
    if (simId) { simSet(simId, e.target.checked); return; }
    if (sheet && sheet.kind === 'settings' && e.target.id === 's-import') {
      if (e.target.files && e.target.files[0]) readImport(e.target.files[0]);
      return;
    }
    if (!sheet || sheet.kind !== 'item') return;
    var n = e.target.name;
    if (n === 'tipo' || n === 'categoria' || n === 'entrada') {
      sheet.draft = defaultsFor(readItemForm().tipo, readItemForm());
      renderSheet(false);
      var focusEl = n === 'tipo' ? sheetRoot.querySelector('input[name="tipo"]:checked')
        : (n === 'categoria' && document.getElementById('f-cat')) || sheetRoot.querySelector('input[name="' + n + '"]:checked');
      if (focusEl) focusEl.focus();
    } else if (n === 'status' || n === 'periodo') {
      Array.prototype.forEach.call(sheetRoot.querySelectorAll('.pill-opt'), function (p) {
        p.classList.toggle('on', p.querySelector('input').checked);
      });
    }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'sim-form') { e.preventDefault(); simAdd(); return; }
    if (e.target.id !== 'sheet-form') return;
    e.preventDefault();
    if (!sheet) return;
    if (sheet.kind === 'item') saveItem();
    else if (sheet.kind === 'lancar') saveLancar();
    else saveSettings();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheet) { closeSheet(); return; }
    var hd = e.target && e.target.closest && e.target.closest('.drag-handle');
    if (hd && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
      e.preventDefault();
      var ol = hd.closest('ol');
      if (!ol) return;
      var ids = Array.prototype.map.call(ol.children, function (x) { return x.getAttribute('data-id'); });
      var i = ids.indexOf(hd.getAttribute('data-id')), j = i + (e.key === 'ArrowUp' ? -1 : 1);
      if (i < 0 || j < 0 || j >= ids.length) return;
      ids.splice(j, 0, ids.splice(i, 1)[0]);
      var noun = ol.getAttribute('data-noun') || 'Agora é a parada ';
      salvarOrdem(ids, ol.getAttribute('data-campo')).then(function () {
        var h2 = document.getElementById('h-' + ids[j]); if (h2) h2.focus();
        toast(noun + (j + 1));
      });
    }
  });

  /* arrastar paradas (funciona com dedo e mouse) */
  var DRAG = null;
  document.addEventListener('pointerdown', function (e) {
    var h = e.target && e.target.closest && e.target.closest('.drag-handle');
    if (!h || (e.pointerType === 'mouse' && e.button !== 0)) return;
    var li = h.closest('li'), ol = li && li.parentNode;
    if (!li || !ol) return;
    e.preventDefault();
    try { h.setPointerCapture(e.pointerId); } catch (x) {}
    DRAG = { li: li, ol: ol, y0: e.clientY, pid: e.pointerId, moved: false };
    li.classList.add('dragging');
  });
  document.addEventListener('pointermove', function (e) {
    if (!DRAG || e.pointerId !== DRAG.pid) return;
    e.preventDefault();
    var li = DRAG.li, gap = 6, dy = e.clientY - DRAG.y0;
    var next = li.nextElementSibling, prev = li.previousElementSibling;
    if (next && dy > next.offsetHeight / 2 + gap / 2) {
      DRAG.ol.insertBefore(next, li); DRAG.y0 += next.offsetHeight + gap; DRAG.moved = true; renumerar(DRAG.ol);
    } else if (prev && dy < -(prev.offsetHeight / 2 + gap / 2)) {
      DRAG.ol.insertBefore(li, prev); DRAG.y0 -= prev.offsetHeight + gap; DRAG.moved = true; renumerar(DRAG.ol);
    }
    li.style.transform = 'translateY(' + (e.clientY - DRAG.y0) + 'px)';
  }, { passive: false });
  function endDrag(e) {
    if (!DRAG || (e && e.pointerId !== DRAG.pid)) return;
    var d = DRAG;
    DRAG = null;
    d.li.style.transform = '';
    d.li.classList.remove('dragging');
    var ids = Array.prototype.map.call(d.ol.children, function (x) { return x.getAttribute('data-id'); });
    if (d.moved) salvarOrdem(ids, d.ol.getAttribute('data-campo'));
    else if (S.renderPendente) render();
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
  window.addEventListener('hashchange', function () { setViewFromHash(); render(); window.scrollTo(0, 0); });

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  /* ---------- dados ---------- */
  setViewFromHash();
  render();

  atualizarCambio(false);
  window.addEventListener('online', function () {
    atualizarCambio(false);
    if (leafletState === 'erro') { leafletState = 'idle'; render(); }
    GEO.tried = {};
    geocodeFila();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') atualizarCambio(false);
  });

  dbReady = Promise.resolve(makeLocalDb());
  dbReady.then(function (db) {
    if (!db) { S.dbState = 'off'; render(); return; }
    dbRef = db;
    S.dbState = 'ready';
    render();
    db.doc('viagem/config').onSnapshot(function (snap) {
      S.configLoaded = true;
      if (snap.exists) {
        var d = snap.data() || {};
        S.config = Object.assign(clone(DEFAULT_CONFIG), clone(d));
        S.configSaved = true;
      } else {
        S.config = clone(DEFAULT_CONFIG);
        S.configSaved = false;
      }
      render();
    }, function () { S.dbState = 'error'; render(); });
    var primeira = true;
    db.collection('itens').onSnapshot(function (qs) {
      S.items = qs.docs.map(function (d) { var o = clone(d.data() || {}); o.id = d.id; return o; })
        .filter(function (o) { return o.tipo && o.titulo; });
      S.loaded = true;
      render();
      if (primeira) { primeira = false; importarSeed(); }
      setTimeout(geocodeFila, 400);
    }, function () { S.dbState = 'error'; render(); });
    db.doc('viagem/dias').onSnapshot(function (snap) {
      var d = snap.exists ? (snap.data() || {}) : {};
      S.diasOk = (d.confirmados && typeof d.confirmados === 'object') ? d.confirmados : {};
      render();
    }, function () {});
    db.collection('simulacao').onSnapshot(function (qs) {
      S.sim = qs.docs.map(function (d) { var o = clone(d.data() || {}); o.id = d.id; return o; })
        .filter(function (o) { return o.nome; });
      render();
    }, function () { S.dbState = 'error'; render(); });
  });
})();
</script>
</body>
</html>
